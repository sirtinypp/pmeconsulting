{% extends "base.html" %}
{% block content %}
<div class="container py-5 mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white py-4 text-center">
                    <h2 class="h4 mb-0 fw-bold">{{ page_title }}</h2>
                    <p class="mb-0 opacity-75">Publish news, articles, or DIY guides to your platform.</p>
                </div>
                <div class="card-body p-5">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">Title</label>
                            <input type="text" name="title" class="form-control form-control-lg bg-light border-0 px-4 py-3" value="{{ post.title }}" placeholder="e.g. 5 Tips for your German Interview" required>
                        </div>

                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">Classification / Category</label>
                                <select name="category" class="form-select bg-light border-0 px-4 py-3" required>
                                    {% for code, label in category_choices %}
                                        <option value="{{ code }}" {% if post.category == code %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">Visual Icon (Emoji)</label>
                                <input type="text" name="cover_emoji" class="form-control bg-light border-0 px-4 py-3" value="{{ post.cover_emoji|default:'📄' }}" placeholder="Paste an emoji here">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">Excerpt (Brief Summary)</label>
                            <textarea name="excerpt" class="form-control bg-light border-0 px-4 py-3" rows="2" placeholder="Shown on the list cards..." required>{{ post.excerpt }}</textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wider">Detailed Content</label>
                            <textarea name="content" class="form-control bg-light border-0 px-4 py-3" rows="12" placeholder="Write your article or guide here..." required>{{ post.content }}</textarea>
                        </div>

                        <div class="mb-5">
                            <div class="form-check form-switch p-4 bg-light rounded-3">
                                <input class="form-check-input" type="checkbox" name="is_published" id="is_published" {% if post.is_published %}checked{% endif %}>
                                <label class="form-check-label fw-bold ms-3" for="is_published">Make this post public immediately</label>
                            </div>
                        </div>

                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold py-3">Save Content Details</button>
                            <a href="{% url 'dashboard' %}" class="btn btn-link text-secondary text-decoration-none py-2">Cancel and Return</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
